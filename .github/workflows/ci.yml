name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps for wgpu/winit
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            pkg-config
      - run: cargo fmt --all --check
      - name: cfg(target_arch = "wasm32") only in loam-app
        run: |
          ! grep -rn --include='*.rs' --exclude-dir=loam-app 'target_arch = "wasm32"' crates/
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p loam-app --no-default-features --all-targets -- -D warnings
      - name: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy -p loam-app -p polytope_playground -p examples --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p loam-app --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - name: the facade's app feature links no egui
        run: |
          tree=$(cargo tree -p loam --features app -e normal --target wasm32-unknown-unknown --prefix none)
          ! grep -qE '^egui v' <<<"$tree"
      - run: cargo build --target wasm32-unknown-unknown -p loam-math -p loam-shape -p loam-physics -p loam-time -p examples
      - name: Build the runnable worker bundle
        run: cargo xtask web --bin polytope_playground --public-url /

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
