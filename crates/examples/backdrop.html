<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{LOAM_BIN}} &middot; Loam</title>

    <script type="module">
        window.__loam_wasm_url = new URL("{{LOAM_PUBLIC_URL}}{{LOAM_BIN}}/{{LOAM_BIN}}.js?v={{LOAM_HASH}}", document.baseURI).href;
        import init from "./{{LOAM_BIN}}.js?v={{LOAM_HASH}}";
        init({ module_or_path: "./{{LOAM_BIN}}_bg.wasm?v={{LOAM_HASH}}" });
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #111522;
        }
        html {
            scrollbar-width: none;
        }
        html::-webkit-scrollbar {
            display: none;
        }
        #loam-canvas-host {
            position: fixed;
            inset: 0;
        }
        #loam-canvas-host canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loam-canvas-host[data-state="failed"] #loam-page-loader {
            display: none;
        }
        .scroll-space {
            height: 300vh;
            pointer-events: none;
        }
        #backdrop-fallback {
            position: fixed;
            left: 24px;
            bottom: 24px;
            margin: 0;
            padding: 12px 16px;
            background: #fff;
            color: #222;
            border-radius: 6px;
            font: 0.95rem/1.4 system-ui, sans-serif;
        }
        #backdrop-fallback[hidden] {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loam-canvas-host">
        <canvas id="loam-canvas" width="1280" height="800"></canvas>
        {{LOAM_PAGE_LOADER}}
    </div>
    <div class="scroll-space"></div>
    <p id="backdrop-fallback" hidden>This page needs WebGPU.</p>

    <script>
        const host = document.getElementById("loam-canvas-host");
        const fallback = document.getElementById("backdrop-fallback");
        if (!navigator.gpu) {
            fallback.hidden = false;
        }
        const sendScroll = () => {
            const range = document.documentElement.scrollHeight - window.innerHeight;
            const values = range > 0 ? Math.min(1, Math.max(0, window.scrollY / range)) : 0;
            host.dispatchEvent(new CustomEvent("loam-message", { detail: { topic: "scroll", values } }));
        };
        host.addEventListener("loam-state", (event) => {
            console.log("loam-state", event.detail.state);
            if (event.detail.state === "loading") {
                sendScroll();
            }
            if (event.detail.state === "failed") {
                fallback.hidden = false;
            }
        });
        host.addEventListener("loam-post", (event) => {
            console.log("loam-post", event.detail.topic, Array.from(event.detail.values));
        });
        window.addEventListener("scroll", sendScroll, { passive: true });
        window.addEventListener("resize", sendScroll, { passive: true });
    </script>
</body>
</html>
