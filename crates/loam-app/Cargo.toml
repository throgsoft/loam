[package]
name = "loam-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Loam app shell: the App trait, winit event loop, scene registry, and console commands on native and browser; capture on native."
keywords = ["winit", "event-loop", "wgpu", "wasm", "gamedev"]
categories = ["game-development"]

[features]
default = ["capture"]
capture = ["dep:image", "dep:gif", "dep:color_quant", "dep:png"]

[dependencies]
anyhow.workspace = true
glam.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
winit.workspace = true
web-time = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
gif = { version = "0.13", optional = true }
color_quant = { version = "1.1", optional = true }
png = { version = "0.17", optional = true }

loam-camera = { path = "../loam-camera", version = "0.1.0" }
loam-console = { path = "../loam-console", version = "0.1.0" }
loam-input  = { path = "../loam-input",  version = "0.1.0" }
loam-math   = { path = "../loam-math",   version = "0.1.0" }
loam-render = { path = "../loam-render", version = "0.1.0" }
loam-time   = { path = "../loam-time",   version = "0.1.0" }
loam-egui   = { path = "../loam-egui",   version = "0.1.0" }
egui-wgpu  = { version = "0.33", default-features = false }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
notify.workspace = true
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlButtonElement",
    "HtmlStyleElement",
    "HtmlHeadElement",
    "Location",
    "UrlSearchParams",
    "Performance",
    "Event",
    "EventTarget",
    "DedicatedWorkerGlobalScope",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "OffscreenCanvas",
    "MessageEvent",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "MouseEvent",
    "KeyboardEvent",
    "WheelEvent",
    "FocusEvent",
    "VisibilityState",
    "CustomEvent",
    "CustomEventInit",
    "Node",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
