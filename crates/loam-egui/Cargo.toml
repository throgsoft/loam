[package]
name = "loam-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "egui integration for Loam: event glue, wgpu paint pass, console panel, world-anchored labels."
keywords = ["egui", "gui", "wgpu", "winit", "gamedev"]
categories = ["game-development", "gui"]

[dependencies]
anyhow.workspace = true
glam.workspace = true
wgpu.workspace = true
winit.workspace = true
egui = "0.33"
egui-wgpu = { version = "0.33", default-features = false, features = ["winit"] }

loam-camera  = { path = "../loam-camera",  version = "0.1.0" }
loam-console = { path = "../loam-console", version = "0.1.0" }
loam-math    = { path = "../loam-math",    version = "0.1.0" }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.33", default-features = false, features = ["clipboard", "links"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { version = "0.33", default-features = false, features = ["links"] }

[dev-dependencies]
glam = { workspace = true }

[lints]
workspace = true
