[package]
build = "../loam-app/build_info.rs"
name = "polytope_playground"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Polytope Playground: rotate the regular 4-polytopes, cut exact cross-sections, and throw them around a 4D toybox. Native and browser."
keywords = ["4d", "polytope", "rotation", "demo", "wgpu"]
categories = ["game-development", "graphics", "visualization"]

[dependencies]
anyhow.workspace = true
glam.workspace = true

loam = { path = "../..", version = "0.1.0", default-features = false, features = ["app", "physics", "render", "text"] }
loam-egui = { path = "../loam-egui", version = "0.1.0" }

[features]
default = ["capture"]
capture = ["loam/capture"]

[lints]
workspace = true
