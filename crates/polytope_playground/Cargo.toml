[package]
build = "../loam-app/build_info.rs"
name = "polytope_playground"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Polytope Playground: rotate the regular 4-polytopes, cut exact cross-sections, and throw them around a 4D toybox. Native and browser."
keywords = ["4d", "polytope", "rotation", "demo", "wgpu"]
categories = ["game-development", "graphics", "visualization"]

[dependencies]
anyhow.workspace = true
glam.workspace = true

loam-app     = { path = "../loam-app",     version = "0.1.0", default-features = false }
loam-math    = { path = "../loam-math",    version = "0.1.0" }
loam-physics = { path = "../loam-physics", version = "0.1.0", default-features = false, features = ["r4"] }
loam-render  = { path = "../loam-render",  version = "0.1.0" }
loam-runtime = { path = "../loam-runtime", version = "0.1.0", features = ["physics"] }
loam-scene   = { path = "../loam-scene",   version = "0.1.0" }
loam-shape   = { path = "../loam-shape",   version = "0.1.0" }

[features]
default = ["capture"]
capture = ["loam-app/capture"]

[lints]
workspace = true
