<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Polytope Playground &middot; Loam</title>

    <link data-trunk rel="rust"
          href="Cargo.toml"
          data-cargo-no-default-features />

    <link data-trunk rel="inline" href="../loam-app/static/worker_bundle.html" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0e0e12;
            color: #d8d8df;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }
        #loam-canvas-host {
            position: absolute;
            inset: 0;
        }
        #loam-canvas-host canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #0e0e12;
        }
    </style>
</head>
<body>
    <div id="loam-canvas-host" data-mode="manual">
        <canvas id="loam-canvas" width="1280" height="800"></canvas>
        <link data-trunk rel="inline" href="../loam-app/static/page_loader.html" />
    </div>
</body>
</html>
