[package]
build = "../loam-app/build_info.rs"
name = "tesseract_demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tesseract with w-depth projection and a free-roam camera, on one render pipeline."
keywords = ["4d", "tesseract", "demo", "wgpu", "graphics"]
categories = ["game-development", "graphics", "visualization"]

[dependencies]
anyhow.workspace = true
glam.workspace = true
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true

loam-app     = { path = "../loam-app",     version = "0.1.0", default-features = false }
loam-egui    = { path = "../loam-egui",    version = "0.1.0" }
loam-math    = { path = "../loam-math",    version = "0.1.0" }
loam-render  = { path = "../loam-render",  version = "0.1.0" }
loam-shape   = { path = "../loam-shape",   version = "0.1.0" }
loam-time    = { path = "../loam-time",    version = "0.1.0" }

[features]
default = ["capture"]
capture = ["loam-app/capture"]

[lints]
workspace = true
