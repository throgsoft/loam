<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Tesseract &middot; Loam</title>

    <script type="module">
        window.__loam_wasm_url = new URL("{{LOAM_PUBLIC_URL}}{{LOAM_BIN}}/{{LOAM_BIN}}.js?v={{LOAM_HASH}}", document.baseURI).href;
        import init from "./{{LOAM_BIN}}.js?v={{LOAM_HASH}}";
        init({ module_or_path: "./{{LOAM_BIN}}_bg.wasm?v={{LOAM_HASH}}" });
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0e0e12;
            color: #d8d8df;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }
        #loam-canvas-host {
            position: absolute;
            inset: 0;
        }
        #loam-canvas-host canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #0e0e12;
        }
    </style>
</head>
<body>
    <div id="loam-canvas-host" data-mode="manual">
        <canvas id="loam-canvas" width="1280" height="800"></canvas>
        {{LOAM_PAGE_LOADER}}
    </div>
</body>
</html>
